name: Staging registry

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: registry-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography jsonschema
      - name: Generate ephemeral staging keypair
        id: sign
        shell: bash
        run: |
          python <<'PY'
          import base64, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          private_key = Ed25519PrivateKey.generate()
          public_key = private_key.public_key()
          pub = base64.b64encode(public_key.public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode()
          priv = base64.b64encode(private_key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())).decode()
          print(f"::add-mask::{priv}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"public_key={pub}\nprivate_key={priv}\n")
          PY
      - name: Sign and validate staging candidate
        shell: bash
        env:
          STAGING_PRIVATE_KEY: ${{ steps.sign.outputs.private_key }}
          STAGING_PUBLIC_KEY: ${{ steps.sign.outputs.public_key }}
        run: |
          STAGING_PUB="${RUNNER_TEMP}/staging-key.pub.json"
          trap 'rm -f "${STAGING_PUB}"' EXIT
          python scripts/ci-sign.py --index registry/index.json --sig registry/index.json.sig --key-id staging-ephemeral --priv-b64 "${STAGING_PRIVATE_KEY}"
          printf '{"key_id":"staging-ephemeral","public_key_b64":"%s"}' "${STAGING_PUBLIC_KEY}" > "${STAGING_PUB}"
          python scripts/validate.py --index registry/index.json --sig registry/index.json.sig --pub "${STAGING_PUB}" --schema schemas/index-v1.json --skip-artifacts --allow-provisional-lifecycle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: staging-registry
          path: registry
          if-no-files-found: error

  publish:
    name: Publish staging registry
    needs: validate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      # Required only for actions-gh-pages to publish gh-pages/staging.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-registry
          path: staged-registry
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./staged-registry
          destination_dir: staging
          keep_files: false
